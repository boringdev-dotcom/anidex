<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AniDex — A field guide to the animals we might lose</title>
    <meta name="description" content="Search an animal. See where it lives, how many remain, how threatened it is, where to see it, and how to help." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0B0B0C" />
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('anidex-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <!-- Cloudflare Web Analytics (cookieless). Only on the live site, so local development and the
         social-card renders (/og) don't count as visits; spa: client-side navigations count as views. -->
    <script>
      (function () {
        var h = location.hostname;
        if ((h !== 'anidex.fyi' && h !== 'www.anidex.fyi') || location.pathname.indexOf('/og') === 0) return;
        var s = document.createElement('script');
        s.defer = true;
        s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
        s.setAttribute('data-cf-beacon', '{"token": "afb2b083c7e9425a94a07ecd5a91d164", "spa": true}');
        document.head.appendChild(s);
      })();
    </script>
  </head>
